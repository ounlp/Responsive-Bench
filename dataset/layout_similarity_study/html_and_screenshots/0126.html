<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>Autocomplete Jokes — Autocomplete Jokes</title>
  <style>
    html {
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      font-size: 36px;
      color: #666;
      background-color: white;
      margin: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    ul {
      list-style-type: none;
      padding-left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2em;
    }

    li {
      margin-bottom: 0.8em;
    }

    a:link {
      color: #666;
      text-decoration: none;
    }

    a:visited {
      color: #666;
    }

    .media {
      display: flex;
      flex-wrap: wrap;
      max-width: 800px;
      justify-content: center;
    }

    li.pane {
      margin-bottom: 2em;
      background-color: hsl(35, 10%, 97%);
      padding-left: 1.2em;
      padding-right: 1.2em;
      padding-top: 1.2em;
      padding-bottom: 1.2em;
      border: 1px solid #ddd;
      box-shadow: 2px 2px #e8e8e8;
    }

    .entry-meta {
      color: hsl(341, 10%, 20%);
      font-weight: bold;
    }

    .media-caption {
      flex-grow: 1;
      font-size: larger;
      margin-top: 1em;
    }

    .text-caption {
      color: #000;
    }

    .time-stamp {
      margin-bottom: 1em;
    }

    .pane video,
    .pane img {
      border-left: 1px solid hsla(30, 14%, 67%, 0.5);
      width: 100%;
    }

    .skip-link {
      position: absolute;
      transform: translateY(-100%);
      left: 0;
      top: 0;
      background: #fff;
      color: #000;
      padding: 0.5rem 0.75rem;
      z-index: 1000;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }

    :focus:not(:focus-visible) {
      outline: none;
    }

    header,
    main,
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    h1 {
      margin-bottom: 0;
    }

    .previous-indexes {
      margin-bottom: 0.5em;
    }

    @media all and (max-width: 414px) {
      body {
        font-size: 12px;
      }

      .name {
        font-size: 1em;
      }

      .project {
        max-width: 320px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="annotation hidden warning" aria-hidden="true"></div>

  <header>
    <h1>Autocomplete Jokes</h1>
  </header>

  <main id="main-content">
    <section class="media" aria-label="Joke entries">
      <ul class="media-list" aria-label="List of autocomplete jokes">
        <li class="pane">
          <article aria-labelledby="joke-time-1">
            <div class="time-stamp entry-meta">
              <time id="joke-time-1" datetime="2018-03-18T13:17:03.305Z">2018-3-18 09:17:03</time>
            </div>
            <div class="text-caption">
              Knock knock! Who's there?
            </div>
          </article>
        </li>
        <li class="pane">
          <article aria-labelledby="joke-time-2">
            <div class="time-stamp entry-meta">
              <time id="joke-time-2" datetime="2018-03-18T10:17:03.076Z">2018-3-18 06:17:03</time>
            </div>
            <div class="text-caption">
              Knock knock! Who's there?
            </div>
          </article>
        </li>
        <li class="pane">
          <article aria-labelledby="joke-time-3">
            <div class="time-stamp entry-meta">
              <time id="joke-time-3" datetime="2018-03-18T07:17:02.757Z">2018-3-18 03:17:02</time>
            </div>
            <div class="text-caption">
              Knock knock! Who's there?
            </div>
          </article>
        </li>
        <li class="pane">
          <article aria-labelledby="joke-time-4">
            <div class="time-stamp entry-meta">
              <time id="joke-time-4" datetime="2018-03-18T04:17:02.800Z">2018-3-18 00:17:02</time>
            </div>
            <div class="text-caption">
              Knock knock! Who's there?
            </div>
          </article>
        </li>
      </ul>
    </section>
  </main>

  <footer>
    <nav class="previous-indexes" aria-label="Previous indexes">
      <a href="#index-6" aria-label="Go to index 6">6</a>
      <span aria-hidden="true"> | </span>
      <a href="#index-5" aria-label="Go to index 5">5</a>
      <span aria-hidden="true"> | </span>
      <a href="#index-4" aria-label="Go to index 4">4</a>
      <span aria-hidden="true"> | </span>
      <a href="#index-3" aria-label="Go to index 3">3</a>
      <span aria-hidden="true"> | </span>
      <a href="#index-2" aria-label="Go to index 2">2</a>
      <span aria-hidden="true"> | </span>
      <a href="#index-1" aria-label="Go to index 1">1</a>
      <span aria-hidden="true"> | </span>
      <a href="#index-0" aria-label="Go to index 0">0</a>
    </nav>
  </footer>

  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added <!DOCTYPE html>; added lang="en" to html; updated title to descriptive page-specific format; added skip link and main landmark with id="main-content"; wrapped page heading in header; converted primary content area to main; converted bottom links area to footer with nav; preserved exactly one descriptive h1; removed empty non-functional anchor wrappers around time elements; ensured all links have descriptive accessible names.
[B] ARIA fixes: added aria-label to section and navigation landmarks where needed; avoided redundant role attributes on semantic landmarks; ensured no positive tabindex remains via JS baseline; marked decorative annotation container aria-hidden.
[C] JS patterns added: implemented C-K1/K3 baseline only — global focus-visible styles and script to remove any positive tabindex values.
-->
