<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Please Log In — Member Portal</title>
  <style>
    :root {
      --bg: #eef2f6;
      --panel: #ffffff;
      --border: #bcc3cb;
      --text: #444;
      --muted: #666;
      --button: #4f4f4f;
      --button-text: #fff;
      --blue: #1200ff;
      --shadow: 0 2px 6px rgba(0,0,0,.12);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .skip-link {
      position: absolute;
      left: 12px;
      top: 12px;
      transform: translateY(-100%);
      background: #fff;
      color: #000;
      padding: 8px 12px;
      z-index: 1000;
      text-decoration: none;
      border: 1px solid #000;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }

    :focus:not(:focus-visible) {
      outline: none;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 1280px;
      min-height: 100vh;
      padding: 56px 0 80px;
    }

    header {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo {
      width: 106px;
      height: 61px;
      background: var(--blue);
      box-shadow: 0 6px 10px rgba(0, 0, 255, 0.25);
      display: block;
    }

    main {
      display: flex;
      justify-content: center;
      padding: 0 8px;
    }

    .login-panel {
      width: 100%;
      max-width: 600px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0 0 5px 5px;
      box-shadow: var(--shadow);
      padding: 46px 40px 34px;
      min-height: 315px;
    }

    h1 {
      margin: 0 0 28px;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
      color: #3f3f3f;
    }

    form {
      max-width: 420px;
      margin: 0 auto;
    }

    .field-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: center;
      gap: 10px 10px;
      margin-bottom: 12px;
    }

    .field-row label {
      text-align: right;
      font-size: 16px;
      color: #666;
    }

    .field-row input[type="text"],
    .field-row input[type="password"] {
      width: 100%;
      height: 24px;
      border: 1px solid #c2c7cd;
      background: #fff;
      padding: 2px 6px;
      font-size: 15px;
      color: #333;
    }

    .checkbox-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: start;
      margin-top: 8px;
      margin-bottom: 32px;
    }

    .checkbox-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #666;
      font-size: 16px;
      line-height: 1.35;
    }

    .checkbox-wrap input {
      width: 15px;
      height: 15px;
      margin: 0;
      flex: 0 0 auto;
    }

    .actions,
    .forgot {
      margin-left: 130px;
    }

    .actions {
      margin-bottom: 30px;
    }

    button[type="submit"] {
      background: var(--button);
      color: var(--button-text);
      border: none;
      border-radius: 2px;
      font-size: 18px;
      padding: 10px 17px;
      min-width: 76px;
      cursor: pointer;
    }

    .forgot a {
      color: #333;
      text-decoration: none;
      font-size: 16px;
      line-height: 1.4;
    }

    .forgot a:hover,
    .forgot a:focus {
      text-decoration: underline;
    }

    .error {
      display: block;
      color: #b00020;
      font-size: 14px;
      margin-top: 4px;
      grid-column: 2;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    footer {
      display: none;
    }

    @media (max-width: 900px) {
      .page {
        padding-top: 60px;
      }

      .login-panel {
        max-width: 600px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding-top: 60px;
      }

      header {
        margin-bottom: 18px;
      }

      .logo {
        width: 108px;
        height: 61px;
      }

      main {
        padding: 0 8px;
      }

      .login-panel {
        max-width: none;
        padding: 16px 20px 34px;
        min-height: 417px;
      }

      h1 {
        font-size: 19px;
        margin-bottom: 22px;
      }

      form {
        max-width: 100%;
      }

      .field-row {
        grid-template-columns: 1fr;
        gap: 6px;
        margin-bottom: 14px;
      }

      .field-row label {
        text-align: center;
        font-size: 17px;
      }

      .field-row input[type="text"],
      .field-row input[type="password"] {
        height: 24px;
      }

      .checkbox-row {
        grid-template-columns: 1fr;
        margin-top: 18px;
        margin-bottom: 34px;
      }

      .checkbox-wrap {
        justify-content: center;
        align-items: flex-start;
        gap: 8px;
        font-size: 17px;
      }

      .checkbox-wrap .checkbox-text {
        display: inline-block;
        max-width: 110px;
        line-height: 1.45;
      }

      .actions,
      .forgot {
        margin-left: 190px;
      }

      .actions {
        margin-bottom: 28px;
      }

      button[type="submit"] {
        font-size: 17px;
        padding: 10px 16px;
      }

      .forgot a {
        display: inline-block;
        max-width: 110px;
        font-size: 17px;
        line-height: 1.35;
      }

      .error {
        grid-column: 1;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="page">
    <header>
      <img src="rick.jpg" alt="" class="logo">
    </header>

    <main id="main-content">
      <section class="login-panel" aria-labelledby="page-title">
        <h1 id="page-title">Please Log In</h1>

        <form novalidate>
          <div class="field-row">
            <label for="username">Username:</label>
            <div>
              <input
                type="text"
                id="username"
                name="username"
                required
                aria-describedby="username-error"
                aria-invalid="false">
              <span id="username-error" class="error" role="alert" aria-live="assertive" hidden></span>
            </div>
          </div>

          <div class="field-row">
            <label for="password">Password:</label>
            <div>
              <input
                type="password"
                id="password"
                name="password"
                required
                aria-describedby="password-error"
                aria-invalid="false">
              <span id="password-error" class="error" role="alert" aria-live="assertive" hidden></span>
            </div>
          </div>

          <div class="checkbox-row">
            <div aria-hidden="true"></div>
            <label class="checkbox-wrap" for="remember">
              <input type="checkbox" id="remember" name="remember">
              <span class="checkbox-text">Remember me for 2 weeks</span>
            </label>
          </div>

          <div class="actions">
            <button type="submit">Log In</button>
          </div>

          <div class="forgot">
            <a href="#">I forgot my password</a>
          </div>

          <div aria-live="polite" id="form-status" class="sr-only"></div>
        </form>
      </section>
    </main>

    <footer></footer>
  </div>

  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });

    const form = document.querySelector('form');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let firstError = null;

      form.querySelectorAll('[required]').forEach(input => {
        const errorEl = document.getElementById(input.getAttribute('aria-describedby'));
        const labelText = input.labels[0].textContent.trim();

        if (!input.value.trim()) {
          input.setAttribute('aria-invalid', 'true');
          errorEl.textContent = `${labelText} is required`;
          errorEl.hidden = false;
          if (!firstError) firstError = input;
        } else {
          input.setAttribute('aria-invalid', 'false');
          errorEl.hidden = true;
          errorEl.textContent = '';
        }
      });

      if (firstError) {
        firstError.focus();
      } else {
        document.getElementById('form-status').textContent = 'Form submitted successfully.';
      }
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added descriptive page title; added skip link and id="main-content"; used semantic header, main, section, and footer; ensured exactly one h1; added meaningful labels for all form inputs; added alt attribute to image; set html lang="en"; added required attributes and accessible error messaging for mandatory fields.
[B] ARIA fixes: avoided redundant landmark roles; used aria-describedby and aria-invalid on required inputs; added live regions for field errors and form status; ensured no tabindex values greater than 0 remain.
[C] JS patterns added: implemented form validation with error announcement (C-F1/F3); implemented tabindex cleanup and focus indicator baseline (C-K1/K3).
-->
