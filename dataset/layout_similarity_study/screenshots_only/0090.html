<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — The Old Rectory Clothing Co</title>
  <style>
    :root{
      --bg:#ffffff;
      --text:#77828d;
      --heading:#77828d;
      --dark:#444b52;
      --border:#dfe4e8;
      --button:#7f9db3;
      --button-text:#ffffff;
      --link:#5f6870;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height:100vh;
    }

    .skip-link{
      position:absolute;
      left:1rem;
      top:0;
      transform:translateY(-100%);
      background:#fff;
      color:#000;
      padding:.75rem 1rem;
      z-index:1000;
      border:1px solid #000;
      text-decoration:none;
    }
    .skip-link:focus{transform:translateY(0)}

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }
    :focus:not(:focus-visible) {
      outline: none;
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:22px 20px 28px;
    }

    header{
      width:100%;
      display:flex;
      justify-content:flex-end;
      margin-bottom:48px;
    }

    .password-link{
      display:inline-block;
      text-decoration:none;
      color:var(--dark);
      border:1px solid var(--border);
      padding:13px 18px;
      font-size:14px;
      letter-spacing:.08em;
      font-weight:700;
      text-transform:uppercase;
      background:#fff;
      min-width:262px;
      text-align:center;
    }

    main{
      width:100%;
      max-width:760px;
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
    }

    h1{
      margin:48px 0 14px;
      color:var(--heading);
      font-size:35px;
      line-height:1.18;
      font-weight:700;
      max-width:700px;
    }

    .subtitle{
      margin:0;
      color:var(--heading);
      font-size:22px;
      line-height:1.2;
      letter-spacing:.12em;
      font-weight:700;
      text-transform:uppercase;
    }

    .status{
      margin:112px 0 0;
      font-size:18px;
      line-height:1.5;
      color:var(--text);
      font-weight:400;
    }

    .lead{
      margin:22px 0 0;
      font-size:18px;
      line-height:1.5;
      color:var(--heading);
      font-weight:700;
    }

    .notify-wrap{
      margin-top:50px;
      width:100%;
      display:flex;
      justify-content:center;
    }

    form{
      width:100%;
      max-width:340px;
    }

    .field-row{
      display:flex;
      width:100%;
    }

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    label.sr-only{display:block}

    input[type="email"]{
      flex:1;
      min-width:0;
      height:46px;
      border:1px solid var(--border);
      border-right:none;
      padding:0 18px;
      font-size:16px;
      color:#666;
      background:#fff;
    }

    input[type="email"]::placeholder{
      color:#666;
      opacity:1;
    }

    .notify-btn{
      height:46px;
      border:1px solid var(--button);
      background:var(--button);
      color:var(--button-text);
      padding:0 19px;
      font-size:14px;
      letter-spacing:.08em;
      font-weight:700;
      text-transform:uppercase;
      cursor:pointer;
      white-space:nowrap;
    }

    .error{
      display:block;
      margin-top:10px;
      font-size:14px;
      color:#b00020;
      text-align:left;
    }

    .share-title{
      margin:52px 0 0;
      font-size:18px;
      line-height:1.4;
      color:var(--heading);
      font-weight:700;
    }

    .share-links{
      margin-top:58px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .share-links a{
      display:inline-block;
      text-decoration:none;
      color:var(--dark);
      border:1px solid var(--border);
      background:#fff;
      padding:7px 12px;
      font-size:12px;
      letter-spacing:.08em;
      font-weight:700;
      text-transform:uppercase;
      min-width:69px;
      text-align:center;
    }

    footer{
      width:100%;
      text-align:center;
      margin-top:72px;
      color:var(--text);
      font-size:14px;
      line-height:1.5;
    }

    footer a{
      color:var(--link);
      text-decoration:underline;
    }

    @media (max-width: 768px){
      .page{
        padding:24px 16px 32px;
      }

      header{
        justify-content:center;
        margin-bottom:54px;
      }

      .password-link{
        min-width:255px;
        padding:12px 16px;
        font-size:14px;
      }

      h1{
        margin-top:8px;
        font-size:38px;
        max-width:620px;
      }

      .subtitle{
        font-size:18px;
      }

      .status{
        margin-top:78px;
      }

      .notify-wrap{
        margin-top:48px;
      }

      form{
        max-width:340px;
      }

      .share-links{
        margin-top:56px;
      }

      footer{
        margin-top:96px;
      }
    }

    @media (max-width: 480px){
      header{
        margin-bottom:58px;
      }

      .password-link{
        min-width:255px;
      }

      h1{
        font-size:31px;
        max-width:320px;
        margin:0 0 14px;
      }

      .subtitle{
        font-size:18px;
        letter-spacing:.12em;
      }

      .status{
        margin-top:76px;
        font-size:17px;
      }

      .lead{
        margin-top:24px;
        font-size:17px;
      }

      .notify-wrap{
        margin-top:50px;
      }

      form{
        max-width:320px;
      }

      input[type="email"]{
        height:42px;
        font-size:16px;
        padding:0 14px;
      }

      .notify-btn{
        height:42px;
        padding:0 15px;
        font-size:13px;
      }

      .share-title{
        margin-top:54px;
      }

      .share-links{
        margin-top:54px;
        gap:11px;
      }

      .share-links a{
        min-width:67px;
        padding:7px 10px;
      }

      footer{
        margin-top:94px;
        font-size:14px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="page">
    <header>
      <a href="#" class="password-link">ENTER USING PASSWORD →</a>
    </header>

    <main id="main-content">
      <h1>The Old Rectory Clothing Co</h1>
      <p class="subtitle">COMING SOON</p>

      <p class="status">Currently closed</p>
      <p class="lead">Be the first to know when we launch.</p>

      <div class="notify-wrap">
        <form novalidate aria-label="Launch notification signup">
          <label for="email" class="sr-only">Email address <span aria-hidden="true">*</span></label>
          <div class="field-row">
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="Email address"
              aria-describedby="email-error"
              aria-invalid="false">
            <button type="submit" class="notify-btn">NOTIFY ME</button>
          </div>
          <span id="email-error" class="error" role="alert" aria-live="assertive" hidden></span>
          <div aria-live="polite" id="form-status" class="sr-only"></div>
        </form>
      </div>

      <h2 class="share-title">Spread the word</h2>

      <nav aria-label="Social sharing">
        <div class="share-links">
          <a href="#">SHARE</a>
          <a href="#">TWEET</a>
          <a href="#">PIN IT</a>
        </div>
      </nav>
    </main>

    <footer>
      <p>This shop will be powered by <a href="#">Shopify</a></p>
    </footer>
  </div>

  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });

    const form = document.querySelector('form');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        let firstError = null;

        form.querySelectorAll('[required]').forEach(input => {
          const errorEl = document.getElementById(input.getAttribute('aria-describedby'));
          const labelText = input.labels && input.labels[0]
            ? input.labels[0].textContent.replace('*', '').trim()
            : input.name;

          if (!input.value.trim()) {
            input.setAttribute('aria-invalid', 'true');
            errorEl.textContent = `${labelText} is required`;
            errorEl.hidden = false;
            if (!firstError) firstError = input;
          } else if (input.type === 'email' && !input.validity.valid) {
            input.setAttribute('aria-invalid', 'true');
            errorEl.textContent = 'Email address must be a valid email';
            errorEl.hidden = false;
            if (!firstError) firstError = input;
          } else {
            input.setAttribute('aria-invalid', 'false');
            errorEl.hidden = true;
            errorEl.textContent = '';
          }
        });

        if (firstError) {
          firstError.focus();
        } else {
          document.getElementById('form-status').textContent = 'Form submitted successfully.';
        }
      });
    }
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added descriptive page title; used header, main, footer, and nav landmarks; added skip link and main-content id; ensured one h1 with sequential heading hierarchy; added explicit label for email input; added descriptive text for links and button; set html lang="en".
[B] ARIA fixes: avoided redundant landmark roles; added unique aria-label to social sharing nav; removed positive tabindex via script baseline; added aria-describedby and aria-invalid for form field.
[C] JS patterns added: implemented C-F1/F3 form validation with error announcement and success status; implemented C-K1/K3 positive tabindex cleanup and focus-visible styling.
-->
