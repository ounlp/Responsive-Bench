<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Connected with Mailchimp — thelodgeonamherstisland.com</title>
  <style>
    :root{
      --bg:#f8e9bf;
      --text:#111111;
      --blue:#1200ff;
      --teal:#0f8796;
      --focus:#005FCC;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .skip-link{
      position:absolute;
      transform:translateY(-100%);
      left:1rem;
      top:0;
      background:#fff;
      color:#000;
      padding:.75rem 1rem;
      z-index:1000;
      text-decoration:none;
    }

    .skip-link:focus{
      transform:translateY(0);
    }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }
    :focus:not(:focus-visible) {
      outline: none;
    }

    .page{
      min-height:100vh;
      padding:40px 40px 56px;
    }

    header{
      margin-bottom:42px;
    }

    .logo-link{
      display:inline-block;
      width:162px;
      height:45px;
      background:var(--blue);
      text-indent:-9999px;
      overflow:hidden;
    }

    .hero{
      display:grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items:center;
      gap:48px;
      max-width:1160px;
      margin:0 auto;
      padding:4px 0 0;
    }

    .hero-copy{
      max-width:620px;
    }

    h1{
      margin:0 0 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-weight:400;
      font-size:3.95rem;
      line-height:.98;
      letter-spacing:-0.03em;
    }

    .subtext{
      margin:0 0 30px;
      font-size:1.05rem;
      line-height:1.35;
      max-width:560px;
    }

    .cta{
      display:inline-block;
      background:var(--teal);
      color:#fff;
      text-decoration:none;
      font-weight:700;
      font-size:1rem;
      padding:15px 32px;
      min-width:182px;
      text-align:center;
      border-radius:2px;
    }

    .hero-media{
      display:flex;
      justify-content:flex-start;
      align-items:flex-start;
    }

    .hero-image{
      width:100%;
      max-width:523px;
      aspect-ratio: 523 / 522;
      background:var(--blue);
      display:block;
      object-fit:cover;
    }

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    @media (max-width: 1024px){
      .page{
        padding:24px 24px 48px;
      }

      header{
        margin-bottom:54px;
      }

      .logo-link{
        width:130px;
        height:45px;
      }

      .hero{
        grid-template-columns:1fr;
        gap:0;
        max-width:560px;
        margin:0 auto;
      }

      .hero-copy{
        max-width:none;
      }

      h1{
        font-size:3.15rem;
        line-height:1.02;
        margin-bottom:22px;
      }

      .subtext{
        font-size:1rem;
        max-width:470px;
        margin-bottom:28px;
      }

      .cta{
        margin-bottom:0;
      }

      .hero-media{
        margin-top:0;
        padding-left:28px;
      }

      .hero-image{
        max-width:none;
        width:100%;
        aspect-ratio: 572 / 322;
        margin-top:0;
        transform:translateY(0);
      }
    }

    @media (max-width: 768px){
      .page{
        padding:23px 24px 40px;
      }

      header{
        margin-bottom:58px;
      }

      .logo-link{
        width:130px;
        height:45px;
      }

      .hero{
        max-width:none;
      }

      .hero-copy{
        padding:0 12px;
      }

      h1{
        font-size:2.35rem;
        line-height:1.02;
        margin-bottom:22px;
        max-width:320px;
      }

      .subtext{
        font-size:1rem;
        line-height:1.2;
        max-width:290px;
        margin-bottom:28px;
      }

      .cta{
        min-width:183px;
        padding:14px 24px;
        font-size:.95rem;
      }

      .hero-media{
        padding-left:14px;
      }

      .hero-image{
        width:338px;
        max-width:calc(100vw - 14px);
        aspect-ratio: 338 / 189;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="page">
    <header>
      <a href="#" class="logo-link">Mailchimp</a>
    </header>

    <main id="main-content">
      <section class="hero" aria-label="Domain connection message">
        <div class="hero-copy">
          <h1>thelodgeonamherstisland.com is connected with Mailchimp</h1>
          <p class="subtext">Put your catchiest ideas online with your own domain.</p>
          <a href="#" class="cta">Find Your Domain</a>
        </div>
        <div class="hero-media">
          <img src="rick.jpg" alt="" class="hero-image">
        </div>
      </section>
    </main>
  </div>

  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added descriptive page title; used header and main landmarks; added skip link and id="main-content"; ensured exactly one h1; added alt attribute to image as decorative; ensured html lang="en"; ensured interactive link text is descriptive.
[B] ARIA fixes: avoided redundant role attributes on semantic landmarks; added aria-label to the hero section for clarity; removed any positive tabindex via script baseline.
[C] JS patterns added: implemented C-K1/K3 focus indicator styles and tabindex cleanup script only, as no other interactive patterns were visible in the screenshots.
-->
