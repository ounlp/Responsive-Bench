<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Protected Area — Site Name</title>
  <style>
    :root {
      --bg: #efefef;
      --panel: #3a3a3a;
      --panel-border: #4a4a4a;
      --text: #ffffff;
      --muted-line: #5a5a5a;
      --button-bg: #d9d9d9;
      --button-border: #8f8f8f;
      --button-text: #333333;
      --input-border: #2f7df6;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: #111;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
    }

    .skip-link {
      position: absolute;
      left: 12px;
      top: 12px;
      transform: translateY(-100%);
      background: #fff;
      color: #000;
      padding: 8px 12px;
      text-decoration: none;
      z-index: 1000;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }

    :focus:not(:focus-visible) {
      outline: none;
    }

    .page-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 103px;
      padding-left: 16px;
      padding-right: 16px;
    }

    main {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .login-panel {
      width: 443px;
      background: var(--panel);
      border: 5px solid var(--panel-border);
      padding: 22px 24px 30px;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--text);
      font-size: 27px;
      line-height: 1.15;
      font-weight: 700;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--muted-line);
      white-space: nowrap;
    }

    .intro {
      margin: 0 0 12px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.35;
      font-weight: 700;
    }

    form {
      margin: 0;
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .field-group {
      flex: 1 1 auto;
      min-width: 0;
    }

    label {
      position: absolute;
      left: -9999px;
    }

    input[type="password"] {
      width: 100%;
      height: 36px;
      border: 2px solid var(--input-border);
      border-radius: 3px;
      background: #fff;
      font-size: 18px;
      padding: 4px 8px;
      color: #111;
    }

    button[type="submit"] {
      height: 34px;
      padding: 0 8px;
      border: 2px solid var(--button-border);
      background: var(--button-bg);
      color: var(--button-text);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      flex: 0 0 auto;
    }

    .error-message {
      display: block;
      margin-top: 8px;
      color: #fff;
      font-size: 14px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .page-wrap {
        padding-top: 102px;
      }

      .login-panel {
        width: 443px;
      }
    }

    @media (max-width: 480px) {
      body {
        justify-content: flex-start;
      }

      .page-wrap {
        justify-content: flex-start;
        padding-top: 103px;
        padding-left: 0;
        padding-right: 0;
      }

      main {
        justify-content: flex-start;
      }

      .login-panel {
        width: 100%;
        border-left-width: 4px;
        border-right-width: 4px;
        padding: 22px 25px 30px;
      }

      h1 {
        font-size: 27px;
        white-space: nowrap;
      }

      .field-row {
        gap: 10px;
      }

      .field-group {
        flex: 1 1 305px;
      }

      button[type="submit"] {
        min-width: 58px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="page-wrap">
    <main id="main-content">
      <section class="login-panel" aria-labelledby="page-title">
        <h1 id="page-title">This area is password protected</h1>
        <p class="intro">Please enter the password below</p>

        <form novalidate>
          <div class="field-row">
            <div class="field-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                aria-describedby="password-error"
                aria-invalid="false"
                autocomplete="current-password">
              <span id="password-error" class="error-message" role="alert" aria-live="assertive" hidden></span>
            </div>
            <button type="submit">Login</button>
          </div>
          <div aria-live="polite" id="form-status" class="sr-only"></div>
        </form>
      </section>
    </main>
  </div>

  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });

    const form = document.querySelector('form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let firstError = null;

      form.querySelectorAll('[required]').forEach(input => {
        const errorEl = document.getElementById(input.getAttribute('aria-describedby'));
        if (!input.value.trim()) {
          input.setAttribute('aria-invalid', 'true');
          errorEl.textContent = `${input.labels[0].textContent.trim()} is required`;
          errorEl.hidden = false;
          if (!firstError) firstError = input;
        } else {
          input.setAttribute('aria-invalid', 'false');
          errorEl.hidden = true;
          errorEl.textContent = '';
        }
      });

      if (firstError) {
        firstError.focus();
      } else {
        document.getElementById('form-status').textContent = 'Form submitted successfully.';
      }
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added descriptive page title; added skip link and id="main-content"; used semantic main and section structure; ensured exactly one h1; added html lang="en"; added associated label for password input; added required attribute and accessible validation messaging; ensured button has descriptive text.
[B] ARIA fixes: avoided redundant landmark roles; added aria-describedby and aria-invalid for form field; used role="alert" and aria-live for error/status messaging; no positive tabindex values used.
[C] JS patterns added: implemented C-F1/F3 form validation with error announcement; implemented C-K1/K3 tabindex cleanup and focus indicator styling.
-->
