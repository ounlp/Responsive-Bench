<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>503 Service Temporarily Unavailable — Server Error</title>
  <style>
    :root{
      --bg-dark:#37424f;
      --text:#4a4a4a;
      --muted:#4f5f70;
      --accent:#f7744f;
      --line:#dddddd;
      --link:#1697f6;
      --white:#ffffff;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--white);
      color: var(--text);
    }

    .skip-link {
      position:absolute;
      left:12px;
      top:12px;
      transform:translateY(-100%);
      background:#fff;
      color:#000;
      padding:8px 12px;
      z-index:1000;
      border:2px solid #005FCC;
      text-decoration:none;
    }
    .skip-link:focus { transform:translateY(0); }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }
    :focus:not(:focus-visible) {
      outline: none;
    }

    body{
      min-height:100vh;
    }

    .page{
      display:flex;
      min-height:100vh;
      width:100%;
    }

    .visual-panel{
      background:var(--bg-dark);
      width:34.4%;
      min-height:100vh;
      flex:0 0 34.4%;
    }

    main{
      flex:1;
      background:#fff;
      padding:100px 50px 60px 50px;
    }

    .content{
      max-width:740px;
    }

    .eyebrow{
      font-size:22px;
      line-height:1.2;
      margin:0 0 8px 0;
      font-weight:400;
      color:var(--text);
    }

    h1{
      margin:0;
      font-size:82px;
      line-height:0.95;
      font-weight:400;
      color:var(--accent);
    }

    .subtitle{
      margin:2px 0 10px 0;
      font-size:38px;
      line-height:1.05;
      font-weight:400;
      color:var(--text);
    }

    .description{
      margin:0 0 22px 0;
      font-size:17px;
      line-height:1.35;
      color:var(--muted);
      max-width:760px;
    }

    hr{
      border:0;
      border-top:1px solid var(--line);
      margin:24px 0 22px 0;
    }

    .help-title{
      margin:0 0 14px 0;
      font-size:16px;
      line-height:1.3;
      font-weight:400;
      color:#000;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .btn{
      display:inline-block;
      text-decoration:none;
      color:var(--link);
      border:2px solid var(--link);
      padding:8px 12px;
      font-size:14px;
      line-height:1;
      background:#fff;
      white-space:nowrap;
    }

    header, footer, nav, aside{
      display:none;
    }

    @media (max-width: 1024px){
      .page{
        display:block;
      }

      .visual-panel{
        width:100%;
        min-height:250px;
      }

      main{
        padding:48px 50px 60px 50px;
      }

      .content{
        max-width:none;
      }

      h1{
        font-size:82px;
      }

      .subtitle{
        font-size:37px;
      }

      .description{
        max-width:680px;
        font-size:17px;
      }
    }

    @media (max-width: 767px){
      .visual-panel{
        min-height:250px;
      }

      main{
        padding:28px 30px 50px 30px;
      }

      .eyebrow{
        font-size:25px;
        margin-bottom:8px;
      }

      h1{
        font-size:78px;
      }

      .subtitle{
        font-size:39px;
        line-height:0.98;
        max-width:320px;
        margin-bottom:10px;
      }

      .description{
        font-size:17px;
        line-height:1.3;
        max-width:320px;
      }

      hr{
        margin:22px 0 22px 0;
      }

      .actions{
        gap:10px 10px;
      }

      .btn{
        font-size:14px;
        padding:8px 12px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="page">
    <aside class="visual-panel" aria-label="Decorative dark panel"></aside>

    <main id="main-content">
      <div class="content">
        <p class="eyebrow">Server Error</p>
        <h1>503</h1>
        <h2 class="subtitle">Service Temporarily Unavailable</h2>
        <p class="description">
          The server is temporarily unable to service your request due to maintenance downtime or capacity problems. Please try again later.
        </p>

        <hr>

        <p class="help-title">That's what you can do</p>

        <nav aria-label="Error page actions">
          <div class="actions">
            <a href="#" class="btn">Reload Page</a>
            <a href="#" class="btn">Back to Previous Page</a>
            <a href="#" class="btn">Home Page</a>
          </div>
        </nav>
      </div>
    </main>
  </div>

  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added descriptive page title; added skip link and id="main-content" to main; used semantic main, nav, and aside landmarks; ensured exactly one h1; added lang="en"; ensured interactive links have descriptive text
[B] ARIA fixes: used unique aria-label on navigation and aside; avoided redundant role attributes on semantic landmarks; removed positive tabindex values via JS baseline
[C] JS patterns added: implemented C-K1/K3 focus indicator styles and tabindex cleanup script only
-->
