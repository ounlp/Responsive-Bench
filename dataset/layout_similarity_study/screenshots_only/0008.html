<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Socrative</title>
  <style>
    :root{
      --navy:#0d4676;
      --search:#426f97;
      --text:#2d2d2d;
      --blue:#1f16ff;
      --white:#ffffff;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      background:#fff;
    }

    .skip-link{
      position:absolute;
      transform:translateY(-100%);
      left:1rem;
      top:0;
      background:#fff;
      color:#000;
      padding:.75rem 1rem;
      z-index:1000;
      text-decoration:none;
    }

    .skip-link:focus{
      transform:translateY(0);
    }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }
    :focus:not(:focus-visible) {
      outline: none;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .site-header{
      background:var(--navy);
      color:var(--white);
      padding:24px 40px 36px;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:20px;
      margin-bottom:48px;
    }

    .logo{
      width:62px;
      height:34px;
      background:linear-gradient(90deg, #0a1cff, #2f1cff);
      display:block;
      flex:0 0 auto;
    }

    .desktop-nav ul,
    .mobile-nav ul{
      list-style:none;
      margin:0;
      padding:0;
      display:flex;
      gap:34px;
      align-items:center;
    }

    .desktop-nav a,
    .mobile-nav a{
      color:#fff;
      font-size:16px;
      font-weight:600;
    }

    .nav-toggle { display: none; }

    .hero{
      max-width:960px;
      margin:0 auto;
    }

    h1{
      margin:0 0 26px;
      font-size:29px;
      line-height:1.2;
      font-weight:700;
      letter-spacing:-0.2px;
    }

    .search-wrap{
      width:100%;
    }

    label.search-label{
      display:block;
    }

    .search-input{
      width:100%;
      height:62px;
      border:none;
      border-radius:12px;
      background:var(--search);
      color:#fff;
      font-size:18px;
      padding:0 28px;
    }

    .search-input::placeholder{
      color:#fff;
      opacity:1;
    }

    .search-input[readonly]{
      cursor:default;
    }

    main{
      min-height:465px;
      background:#fff;
    }

    .error-section{
      text-align:center;
      padding:74px 20px 40px;
    }

    .error-section h2{
      margin:0 0 14px;
      font-size:18px;
      line-height:1.4;
      letter-spacing:2.4px;
      font-weight:700;
      text-transform:uppercase;
      color:#2f2f2f;
    }

    .error-section p{
      margin:0;
      font-size:18px;
      line-height:1.35;
      color:#2f2f2f;
    }

    .error-section p + p{
      margin-top:8px;
    }

    .error-section .message-gap{
      margin-top:18px;
    }

    .bottom-mark{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap:40px;
      padding:90px 0 38px;
    }

    .bottom-logo{
      width:56px;
      height:32px;
      background:linear-gradient(90deg, #2a1cff, #2a1cff);
    }

    .dots{
      display:flex;
      gap:16px;
      align-items:center;
      justify-content:center;
    }

    .dots span{
      width:16px;
      height:9px;
      background:#2a1cff;
      display:block;
    }

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    @media (max-width: 768px) {
      .nav-toggle { 
        display: block;
        background:transparent;
        border:none;
        color:#fff;
        font-size:28px;
        padding:4px 8px;
        margin-left:auto;
      }

      .desktop-nav{
        display:none;
      }

      .topbar{
        margin-bottom:46px;
      }

      .site-header{
        padding:24px 20px 37px;
      }

      h1{
        font-size:29px;
        line-height:1.18;
        margin-bottom:26px;
        max-width:340px;
      }

      .search-input{
        height:61px;
        font-size:17px;
        padding:0 22px;
      }

      #mobile-nav{
        margin-top:16px;
      }

      .mobile-nav ul{
        flex-direction:column;
        align-items:flex-start;
        gap:14px;
      }

      .error-section{
        padding:74px 20px 20px;
      }

      .error-section h2{
        font-size:17px;
        letter-spacing:2.2px;
      }

      .error-section p{
        font-size:17px;
      }

      .bottom-mark{
        padding:145px 0 28px;
        gap:40px;
      }

      .bottom-logo{
        width:58px;
        height:32px;
      }
    }

    @media (min-width: 769px) {
      .mobile-nav{
        display:none;
      }
    }

    @media (min-width: 1024px){
      .site-header{
        padding:24px 0 37px;
      }

      .topbar,
      .hero{
        width:min(960px, calc(100% - 120px));
        margin-left:auto;
        margin-right:auto;
      }

      .topbar{
        margin-bottom:49px;
      }

      h1{
        font-size:29px;
      }

      .error-section{
        padding-top:74px;
      }

      .bottom-mark{
        padding-top:140px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <div class="topbar">
      <a href="#" aria-label="Socrative home">
        <span class="logo" aria-hidden="true"></span>
      </a>

      <button
        id="nav-toggle"
        aria-expanded="false"
        aria-controls="mobile-nav"
        aria-label="Open navigation menu"
        class="nav-toggle">
        <span aria-hidden="true">&#9776;</span>
      </button>

      <nav aria-label="Main" class="desktop-nav">
        <ul>
          <li><a href="#">Go to Socrative</a></li>
          <li><a href="#">English</a></li>
        </ul>
      </nav>
    </div>

    <nav id="mobile-nav" aria-label="Main" class="mobile-nav" hidden>
      <ul>
        <li><a href="#">Go to Socrative</a></li>
        <li><a href="#">English</a></li>
      </ul>
    </nav>

    <div class="hero">
      <h1>Advice and answers from the Socrative Team</h1>
      <div class="search-wrap">
        <label for="search" class="search-label">
          <span class="sr-only">Search for articles...</span>
        </label>
        <input id="search" class="search-input" type="text" placeholder="Search for articles..." aria-label="Search for articles..." readonly>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="error-section" aria-label="Page not found message">
      <h2>UH OH. THAT PAGE DOESN’T EXIST.</h2>
      <p>That page isn’t here anymore</p>
      <p>Try searching for your answer</p>
      <p class="message-gap">Or just send us a message</p>
    </section>

    <div class="bottom-mark" aria-hidden="true">
      <div class="bottom-logo"></div>
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </main>

  <script>
    const toggle = document.getElementById('nav-toggle');
    const nav = document.getElementById('mobile-nav');

    toggle.addEventListener('click', () => {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      toggle.setAttribute('aria-label', expanded ? 'Open navigation menu' : 'Close navigation menu');
      nav.hidden = expanded;
      if (!expanded) {
        nav.querySelector('a, button').focus();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && nav.hidden === false) {
        nav.hidden = true;
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open navigation menu');
        toggle.focus();
      }
    });

    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added descriptive page title; added semantic header, nav, main; added skip link and main-content id; used one h1 and sequential heading hierarchy; added accessible label for search input; ensured interactive elements have descriptive labels; set html lang="en".
[B] ARIA fixes: used aria-label on navigation regions; avoided redundant role attributes on semantic landmarks; added aria-controls and aria-expanded for mobile navigation; ensured no tabindex values greater than 0 remain.
[C] JS patterns added: implemented C-N1 hamburger menu for mobile; implemented C-K1/K3 focus indicator and tabindex cleanup.
-->
