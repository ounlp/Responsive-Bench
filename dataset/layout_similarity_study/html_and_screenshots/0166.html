<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore North Wales Coming Soon — Menai Holidays</title>
  <style>
    @font-face {
      font-family: 'Open Sans';
      font-style: normal;
      font-weight: 400;
      font-stretch: normal;
      src: url(https://fonts.gstatic.com/s/opensans/v36/memSYaGs126MiZpBA-UvWbX2vVnXBbObj2OVZyOOSr4dVJWUgsjZ0B4gaVc.ttf) format('truetype');
    }

    html, body {
      height: 100%;
    }

    body.holdingpage-main {
      background: url(/images/brands/menai/menai_bridge_background.jpg) no-repeat center center fixed;
      background-size: cover;
      font-family: "Arial", sans-serif;
      text-align: center;
      color: #fff;
      margin: 0;
    }

    svg {
      max-height: 40px;
    }

    h1 {
      text-shadow: 0px 2px 1px #000;
      font-size: 1.2rem;
      margin-top: 0;
    }

    p {
      font-size: 1rem;
      text-shadow: 0px 2px 1px #000;
    }

    a {
      color: #FFF;
      font-weight: bold;
      text-decoration: none;
      text-shadow: 0px 1px 1px #000;
    }

    a:hover {
      color: #185ea2;
    }

    .outer {
      position: relative;
      height: 100%;
      width: 100%;
      background-color: rgba(0,0,0,0.3);
    }

    .middle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90%;
      transform: translateY(-50%) translateX(-50%);
    }

    .inner {
      margin-left: auto;
      margin-right: auto;
      max-width: 1000px;
      text-align: center;
    }

    .skip-link {
      position: absolute;
      transform: translateY(-100%);
      left: 0;
      top: 0;
      background: #ffffff;
      color: #000000;
      padding: 0.75rem 1rem;
      z-index: 1000;
      text-shadow: none;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }

    :focus:not(:focus-visible) {
      outline: none;
    }

    @media only screen and (min-width: 768px) {
      h1 {
        font-size: 2rem;
        text-shadow: 0px 2px 1px #000;
      }

      p {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body class="holdingpage-main">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <main id="main-content" class="outer">
    <div class="middle">
      <div class="inner">
        <h1>Explore North Wales Coming Soon!</h1>
        <p>Explore North Wales will offer a host of handpicked local information. Discover a wealth of things to see and do, local events, great places to eat and drink and so many places to visit.</p>
        <p>Team Menai Holidays</p>
        <br>
        <a href="/" aria-label="Visit the Menai Holidays website">Visit our Website</a>
      </div>
    </div>
  </main>

  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added <!DOCTYPE html>; added lang="en"; added descriptive page title; added viewport and charset meta tags; added skip link as first body child; converted main content wrapper to <main id="main-content">; preserved single descriptive <h1>; fixed interactive link by adding href and descriptive aria-label.
[B] ARIA fixes: avoided redundant landmark roles; ensured only necessary ARIA was used; included baseline positive tabindex cleanup support.
[C] JS patterns added: implemented C-K1/K3 positive tabindex removal script and global focus-visible indicator styling.
-->
