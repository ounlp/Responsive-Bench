<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Scroll Violation Example</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 800px; /* Fixed width that causes horizontal scroll on mobile */
            margin: 0 auto;
            padding: 20px;
            background: #f0f0f0;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>This page has horizontal scroll on mobile</h1>
        <p>This container has a fixed width of 800px, which will cause horizontal scrolling on devices with viewport width less than 800px.</p>
    </div>
</body>
</html>
