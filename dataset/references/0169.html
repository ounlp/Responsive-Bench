    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');

      form.querySelectorAll('[required]').forEach(input => {
        const errorEl = document.getElementById(input.getAttribute('aria-describedby'));
        const labelText = input.labels && input.labels[0]

        if (!input.value.trim()) {
          input.setAttribute('aria-invalid', 'true');
          input.classList.add('input-error');
          errorEl.textContent = `${labelText} is required`;
          errorEl.hidden = false;
          if (!firstError) firstError = input;
        } else {
          input.setAttribute('aria-invalid', 'false');
          input.classList.remove('input-error');
          errorEl.hidden = true;
          errorEl.textContent = '';
        }
      });

      if (firstError) {
        statusEl.textContent = 'Please correct the errors in the form.';
        firstError.focus();
      } else {
        statusEl.textContent = 'Form submitted successfully.';
        form.submit();
      }
    });
