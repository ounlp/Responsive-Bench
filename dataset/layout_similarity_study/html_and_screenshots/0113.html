<!DOCTYPE html>
<html lang="en">
<head>
  <title>Video Conferencing — Zoom</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="referrer" content="origin-when-cross-origin">
  <meta name="keywords" content="zoom, zoom.us, video conferencing, video conference, online meetings, web meeting, video meeting, cloud meeting, cloud video, group video call, group video chat, screen share, application share, mobility, mobile collaboration, desktop share, video collaboration, group messaging">
  <meta name="description" content="Zoom unifies cloud video conferencing, simple online meetings, and cross platform group chat into one easy-to-use platform. Our solution offers the best video, audio, and screen-sharing experience across Zoom Rooms, Windows, Mac, iOS, Android, and H.323/SIP room systems.">
  <style>
    html, body {
      margin: 0px;
      font-family: sans-serif;
      height: 100%;
    }
    .container {
      display: table;
      height: 100%;
      width: 100%;
      background-image: url("");
      background-size: cover;
    }
    .content-body {
      display: table-cell;
      vertical-align: middle;
    }
    a {
      text-decoration: none;
      color: #2470cc;
    }
    a:hover {
      text-decoration: none;
    }
    .content {
      padding: 40px;
      max-width: 450px;
      margin-left: 45%;
    }
    h1 {
      padding-top: 20px;
      padding-bottom: 20px;
      font-weight: normal;
    }
    p {
      font-size: 17px;
    }
    .button {
      width: 80px;
      background-color: #2D8CFF;
      border: 1px solid #2D8CFF;
      padding: 12px 20px;
      display: inline-block;
      text-align: center;
      margin: 10px 0;
      transition: .3s ease;
    }
    .button:hover,
    .button:focus-visible {
      background-color: rgb(45, 165, 255);
    }
    .btn-text {
      color: white;
      font-size: 17px;
    }
    .made-with {
      padding-top: 15px;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    .made-with a {
      text-decoration: underline;
    }
    .row > div {
      display: inline-block;
      vertical-align: middle;
    }
    .right {
      margin-left: 15px;
    }
    .right > span {
      display: block;
    }
    .zoom-logo {
      width: 140px;
      height: 31.5px;
      display: block;
      background: #1d12f2;
    }
    footer.footer {
      display: table-row;
      height: 60px;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.15);
      vertical-align: middle;
    }
    footer.footer a {
      padding-right: 40px;
      width: 99px;
      height: 19px;
      opacity: 0.6;
      font-size: 14px;
      font-weight: normal;
      font-style: normal;
      font-stretch: normal;
      line-height: 60px;
      letter-spacing: normal;
      color: #232333 !important;
    }
    footer.footer a:hover,
    footer.footer a:active,
    footer.footer a:focus {
      text-decoration: underline;
    }

    .skip-link {
      position: absolute;
      transform: translateY(-100%);
      left: 0;
      top: 0;
      background: #ffffff;
      color: #000000;
      padding: 12px 16px;
      z-index: 1000;
    }
    .skip-link:focus {
      transform: translateY(0);
    }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }
    :focus:not(:focus-visible) {
      outline: none;
    }

    @media screen and (max-width: 768px) {
      h1 {
        font-size: 27px;
      }
      .row {
        margin-bottom: 15px;
      }
      .row > div {
        display: block;
      }
      footer.footer {
        padding-bottom: 15px;
        height: 40px;
      }
      footer.footer a {
        display: block;
        width: 100%;
        height: inherit;
        padding-left: 0;
        padding-right: 0;
      }
      .content {
        margin: auto;
      }
      .content > div,
      .made-with,
      .row,
      .right,
      .left {
        text-align: center;
      }
      .right {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="container">
    <main id="main-content" class="content-body">
      <div class="HiddenText">
        <a id="the-main-content" tabindex="-1"></a>
      </div>
      <div class="content">
        <div class="row">
          <img alt="Zoom" class="zoom-logo" src="rick.jpg">
        </div>
        <div class="row">
          <h1>Video Conferencing</h1>
        </div>
        <div class="row">
          <div class="left">
            <a class="button" href="#" aria-label="Join a meeting">
              <span class="btn-text">Join</span>
            </a>
          </div>
          <div class="right">
            <span>Connect to a meeting in progress</span>
          </div>
        </div>
        <div class="row">
          <div class="left">
            <a class="button" href="#" aria-label="Host a meeting">
              <span class="btn-text">Host</span>
            </a>
          </div>
          <div class="right">
            <span>Start a meeting</span>
          </div>
        </div>
        <div class="row">
          <div class="left">
            <a class="button" href="#" aria-label="Sign in to your account">
              <span class="btn-text">Sign in</span>
            </a>
          </div>
          <div class="right">
            <span>Configure your account</span>
          </div>
        </div>
        <p class="made-with">
          Made with
          <a href="#">Zoom</a>
        </p>
      </div>
    </main>
    <footer class="footer">
      <a href="#">Getting Started</a>
      <a href="#">Download Client</a>
      <a href="#" target="_blank" rel="noopener noreferrer">Zoom Support</a>
    </footer>
  </div>
  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: updated title to "Video Conferencing — Zoom"; set html lang to "en"; added skip link as first child of body; converted main content wrapper to <main id="main-content">; converted footer div to <footer>; preserved single descriptive h1; ensured all images have alt text; added descriptive href/text to all links.
[B] ARIA fixes: removed redundant role="main" and aria-label from main wrapper; kept only appropriate tabindex="-1" focus target; ensured no positive tabindex values remain via JS baseline.
[C] JS patterns added: implemented C-K1/K3 positive tabindex cleanup and global focus-visible indicator.
-->
