<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Notice — H&Iグローバルリサーチ（株）</title>
  <style>
    :root {
      --text: #1f252d;
      --bg: #ffffff;
      --link: #2a2f36;
      --focus: #005FCC;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
    }

    .skip-link {
      position: absolute;
      left: 12px;
      top: 12px;
      transform: translateY(-100%);
      background: #fff;
      color: #000;
      padding: 10px 14px;
      text-decoration: none;
      z-index: 1000;
      border: 2px solid #000;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }

    :focus:not(:focus-visible) {
      outline: none;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 68px;
      padding-bottom: 40px;
    }

    main {
      width: 100%;
    }

    .notice {
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
      padding: 0 24px;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0;
    }

    .message {
      margin-top: 122px;
      font-size: 28px;
      line-height: 1.65;
      font-weight: 400;
    }

    .message p {
      margin: 0;
    }

    .links {
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      gap: 54px;
      align-items: center;
    }

    .links a {
      color: var(--link);
      font-size: 28px;
      line-height: 1.4;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    @media (max-width: 1024px) {
      .page {
        padding-top: 69px;
      }

      .notice {
        max-width: 700px;
      }

      h1 {
        font-size: 36px;
      }

      .message {
        margin-top: 118px;
        font-size: 27px;
      }

      .links a {
        font-size: 27px;
      }
    }

    @media (max-width: 768px) {
      .page {
        padding-top: 46px;
      }

      .notice {
        max-width: 420px;
        padding: 0 20px;
      }

      h1 {
        font-size: 33px;
        line-height: 1.05;
      }

      .message {
        margin-top: 58px;
        font-size: 22px;
        line-height: 1.9;
      }

      .links {
        margin-top: 48px;
        gap: 56px;
      }

      .links a {
        font-size: 21px;
        line-height: 1.45;
        word-break: break-word;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="page">
    <main id="main-content">
      <section class="notice" aria-label="Maintenance notice">
        <h1>H&amp;Iグローバルリサーチ（株）</h1>

        <div class="message">
          <p>当サイトはメインテナンス中です。</p>
          <p>次のサイトをご利用ください。</p>
        </div>

        <div class="links">
          <a href="#">https://www.marketreport.jp/</a>
          <a href="#">https://www.globalresearch.co.jp/</a>
        </div>
      </section>
    </main>
  </div>

  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added descriptive page title; added skip link as first body child; added main landmark with id="main-content"; used a single h1 for the page heading; set html lang="en"; ensured interactive links have descriptive text.
[B] ARIA fixes: avoided redundant role attributes on semantic landmarks; added aria-label to the visible content section for clarity; removed any tabindex values greater than 0 via script baseline.
[C] JS patterns added: implemented C-K1/K3 focus indicator styles and tabindex cleanup script only; no other interactive patterns were visible in the screenshots.
-->
