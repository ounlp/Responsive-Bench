<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="ie=edge" http-equiv="x-ua-compatible">
  <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
  <title>503 Service Temporarily Unavailable — Example Site</title>
  <style>
   /* Copyright 1999-2017. Parallels IP Holdings GmbH. All Rights Reserved. */
html {
    overflow-y: scroll;
    color: #000;
    font: 400 62.5%/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
}
body,
html {
    height: 100%;
    min-height: 100%;
}
body {
    margin: 0;
    font-size: 1.3rem;
    background: #fff;
    color: #000;
}
a {
    cursor: pointer;
    text-decoration: none;
    color: #2498e3;
    background-color: transparent;
}
a:active,
a:hover {
    text-decoration: underline;
    color: #188dd9;
    outline: 0;
}
h1,
h2 {
    margin: 0 0 0.5rem;
    color: #444;
    font-weight: 400;
    line-height: 1;
}
h1 { font-size: 2.4rem; }
h2 { font-size: 3.6rem; }
.error-code {
    color: #f47755;
    font-size: 8rem;
    line-height: 1;
}
p { margin: 1.2rem 0; }
p.lead {
    font-size: 1.6rem;
    color: #4f5a64;
}
hr {
    box-sizing: content-box;
    height: 0;
    margin: 2.4rem 0;
    border: 0;
    border-top: 1px solid #ddd;
}
.page {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    min-height: 100vh;
}
.page:before {
    display: block;
    content: '';
    -webkit-box-flex: 0;
    -ms-flex: 0 1 474px;
    flex: 0 1 474px;
    background: #38444f url(server.svg) 50% 6em no-repeat;
    background-size: 44% auto;
}
.main {
    -webkit-box-flex: 1;
    -ms-flex: 1 1 70%;
    flex: 1 1 70%;
    box-sizing: border-box;
    padding: 10rem 5rem 5rem;
    min-height: 100vh;
}
.error-description {
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
}
.help-actions a {
    display: inline-block;
    border: 2px solid #23a7de;
    margin: 0 0.5rem 0.5rem 0;
    padding: 0.5rem 1rem;
    text-decoration: none;
    -webkit-transition: 0.25s ease;
    transition: 0.25s ease;
}
.help-actions a:hover {
    text-decoration: none;
    background: #23a7de;
    color: #fff;
}
.skip-link {
    position: absolute;
    transform: translateY(-100%);
    left: 0;
    top: 0;
    background: #fff;
    color: #000;
    padding: 0.8rem 1.2rem;
    z-index: 1000;
}
.skip-link:focus {
    transform: translateY(0);
}
:focus-visible {
    outline: 3px solid #005FCC;
    outline-offset: 2px;
    border-radius: 2px;
}
:focus:not(:focus-visible) {
    outline: none;
}
@media (max-width:959px) {
    .page:before {
        -ms-flex-preferred-size: 400px;
        flex-basis: 400px;
        background-position: 50% 4rem;
    }
    .main { padding: 5rem; }
}
@media (max-width: 769px) {
    .page {
        -webkit-box-orient: vertical;
        -webkit-box-direction: normal;
        -ms-flex-direction: column;
        flex-direction: column;
    }
    .page:before {
        -ms-flex-preferred-size: 250px;
        flex-basis: 250px;
        background-position: 5rem -4.8rem;
        background-size: 166px auto;
    }
    .main {  /* for IE 11 */
        min-height: 0;
        -webkit-box-flex: 0;
        -ms-flex: none;
        flex: none;
    }
}
@media (max-width: 479px) {
    h2 { font-size: 3rem; }
    .main { padding: 3rem; }
}
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="page">
    <main class="main" id="main-content">
      <h1>503 Service Temporarily Unavailable</h1>
      <div class="error-code" aria-hidden="true">503</div>
      <h2>Server Error</h2>
      <p class="lead">
        The server is temporarily unable to service your request due to maintenance downtime or capacity problems. Please try again later.
      </p>
      <hr>
      <p>
        That’s what you can do
      </p>
      <div class="help-actions">
        <a href="" onclick="window.location.reload(); return false;">Reload Page</a>
        <a href="" onclick="history.back(); return false;">Back to Previous Page</a>
        <a href="/">Home Page</a>
      </div>
    </main>
  </div>
  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: updated title to descriptive page-specific format; added skip link as first body child; replaced main content container div with semantic <main> and added id="main-content"; ensured exactly one descriptive h1 and sequential heading hierarchy; added descriptive href/functionality to action links; preserved lang="en".
[B] ARIA fixes: avoided redundant landmark roles; no multiple nav/aside/section landmarks requiring labels; ensured no positive tabindex remains; marked decorative error code as aria-hidden.
[C] JS patterns added: implemented C-K1/K3 focus indicator styles and JS cleanup for positive tabindex values only.
-->
