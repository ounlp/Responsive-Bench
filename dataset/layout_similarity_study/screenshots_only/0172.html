<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Playground — Portfolio Site</title>
  <style>
    :root{
      --bg:#252322;
      --text:#5f5b5b;
      --text-soft:#6a6666;
      --nav:#5a5656;
      --dot:#6a6666;
      --dot-active:#0f5f8d;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height:100vh;
    }

    .skip-link { position:absolute; transform:translateY(-100%); left:12px; top:12px; background:#fff; color:#000; padding:8px 12px; z-index:1000; text-decoration:none; }
    .skip-link:focus { transform:translateY(0); }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }
    :focus:not(:focus-visible) {
      outline: none;
    }

    .page{
      min-height:100vh;
      position:relative;
      overflow:hidden;
    }

    header.site-header{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      z-index:10;
      padding:28px 34px 0 0;
    }

    .header-inner{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      width:100%;
    }

    .brand{
      display:block;
      width:18px;
      height:18px;
      margin-left:0;
    }

    .brand img{
      display:block;
      width:18px;
      height:18px;
      object-fit:cover;
    }

    nav[aria-label="Main"] ul{
      list-style:none;
      margin:0;
      padding:0;
      display:flex;
      gap:92px;
      align-items:center;
    }

    nav[aria-label="Main"] a{
      color:var(--nav);
      text-decoration:none;
      font-size:17px;
      font-weight:700;
      letter-spacing:0.02em;
      text-transform:uppercase;
    }

    .nav-toggle { display: none; }

    main{
      min-height:100vh;
      position:relative;
    }

    .hero{
      min-height:100vh;
      position:relative;
      padding:0;
    }

    .hero-copy{
      position:absolute;
      left:70px;
      bottom:74px;
    }

    h1{
      margin:0 0 12px 0;
      font-size:31px;
      line-height:1.05;
      color:var(--text);
      font-weight:700;
    }

    .location{
      margin:0;
      font-size:18px;
      line-height:1.2;
      color:var(--text-soft);
      font-weight:400;
    }

    .pagination{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:42px;
      display:flex;
      align-items:center;
      gap:24px;
    }

    .pagination button{
      width:8px;
      height:8px;
      border-radius:50%;
      border:none;
      background:var(--dot);
      padding:0;
      cursor:default;
    }

    .pagination button.active{
      width:12px;
      height:12px;
      background:var(--dot-active);
    }

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    footer{display:none}

    @media (max-width: 1024px){
      header.site-header{
        padding-right:24px;
      }
      nav[aria-label="Main"] ul{
        gap:56px;
      }
      .hero-copy{
        left:28px;
        bottom:72px;
      }
      h1{
        font-size:33px;
      }
      .location{
        font-size:17px;
      }
      .pagination{
        bottom:34px;
        gap:26px;
      }
      .pagination button{
        width:7px;
        height:7px;
      }
      .pagination button.active{
        width:12px;
        height:12px;
      }
    }

    @media (max-width: 768px) {
      .nav-toggle { display: block; }
      .desktop-nav{display:none}
      .nav-toggle{
        margin-left:auto;
        margin-right:16px;
        margin-top:4px;
        background:transparent;
        color:var(--nav);
        border:none;
        font-size:28px;
        line-height:1;
      }
      #mobile-nav{
        position:absolute;
        top:56px;
        right:16px;
        background:rgba(37,35,34,.98);
        padding:12px 16px;
      }
      #mobile-nav ul{
        list-style:none;
        margin:0;
        padding:0;
        display:flex;
        flex-direction:column;
        gap:14px;
      }
      #mobile-nav a{
        color:var(--nav);
        text-decoration:none;
        font-size:16px;
        font-weight:700;
        text-transform:uppercase;
      }
    }

    @media (max-width: 480px){
      header.site-header{
        padding-right:0;
      }
      .hero-copy{
        left:14px;
        bottom:22px;
      }
      h1{
        font-size:22px;
        margin-bottom:10px;
      }
      .location{
        font-size:14px;
      }
      .pagination{
        display:none;
      }
      .nav-toggle{
        margin-right:10px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="page">
    <header class="site-header">
      <div class="header-inner">
        <a href="#" class="brand" aria-label="Home">
          <img src="rick.jpg" alt="Site logo">
        </a>

        <button
          id="nav-toggle"
          aria-expanded="false"
          aria-controls="mobile-nav"
          aria-label="Open navigation menu"
          class="nav-toggle">
          <span aria-hidden="true">&#9776;</span>
        </button>

        <nav class="desktop-nav" aria-label="Main">
          <ul>
            <li><a href="#">DESIGN</a></li>
            <li><a href="#">NEWS</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">CONNECT</a></li>
          </ul>
        </nav>

        <nav id="mobile-nav" aria-label="Main" hidden>
          <ul>
            <li><a href="#">DESIGN</a></li>
            <li><a href="#">NEWS</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">CONNECT</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <section class="hero" aria-label="Featured project">
        <div class="hero-copy">
          <h1>The Playground</h1>
          <p class="location">New York, NY</p>
        </div>

        <div class="pagination" aria-label="Project slides">
          <button class="active" aria-label="Slide 1 current"></button>
          <button aria-label="Slide 2"></button>
          <button aria-label="Slide 3"></button>
          <button aria-label="Slide 4"></button>
        </div>
      </section>
    </main>

    <footer></footer>
  </div>

  <script>
    const toggle = document.getElementById('nav-toggle');
    const nav = document.getElementById('mobile-nav');

    toggle.addEventListener('click', () => {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      toggle.setAttribute('aria-label', expanded ? 'Open navigation menu' : 'Close navigation menu');
      nav.hidden = expanded;
      if (!expanded) {
        nav.querySelector('a, button').focus();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && nav.hidden === false) {
        nav.hidden = true;
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open navigation menu');
        toggle.focus();
      }
    });

    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added descriptive page title; used header, nav, main, footer landmarks; added skip link and main-content id; ensured one h1 with sequential heading structure; added alt text for image; added descriptive labels for links and button; set html lang="en"
[B] ARIA fixes: avoided redundant landmark roles; provided unique labeling context for navigation regions via desktop and mobile usage; removed positive tabindex if present through JS baseline
[C] JS patterns added: implemented hamburger menu with aria-expanded, aria-controls, focus handling, and Escape close; implemented tab order cleanup and focus indicator support
-->
