<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login to Share — Facebook</title>
  <style>
    :root {
      --facebook-blue: #3f5f9f;
      --button-blue: #4f72b8;
      --link-blue: #2d4f93;
      --green: #43c62f;
      --text: #111111;
      --label: #5f6670;
      --border: #d7dbe2;
      --focus: #005FCC;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
    }

    .skip-link {
      position: absolute;
      left: 12px;
      top: 0;
      transform: translateY(-100%);
      background: #fff;
      color: #000;
      padding: 8px 12px;
      z-index: 1000;
      text-decoration: none;
      border: 1px solid #000;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }

    :focus:not(:focus-visible) {
      outline: none;
    }

    .site-header {
      background: var(--facebook-blue);
      height: 33px;
      display: flex;
      align-items: center;
      padding: 0 30px;
    }

    .brand {
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      line-height: 1;
    }

    main {
      padding-top: 14px;
      min-height: calc(100vh - 33px);
    }

    .intro {
      margin: 0 0 18px 30px;
      font-size: 14px;
      line-height: 1.4;
    }

    .login-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    form {
      width: 380px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 145px 1fr;
      align-items: center;
      column-gap: 10px;
      margin-bottom: 9px;
    }

    .field-row label {
      font-size: 14px;
      color: var(--label);
      font-weight: 700;
      text-align: right;
    }

    .field-row input {
      width: 194px;
      height: 24px;
      border: 1px solid var(--border);
      padding: 2px 6px;
      font-size: 14px;
      background: #fff;
    }

    .actions {
      margin-left: 155px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 11px;
      padding-top: 10px;
    }

    .login-btn {
      background: var(--button-blue);
      color: #fff;
      border: 1px solid #4667a8;
      font-size: 14px;
      font-weight: 700;
      padding: 4px 12px 5px;
      cursor: pointer;
      min-height: 25px;
    }

    .forgot-link {
      color: var(--link-blue);
      text-decoration: none;
      font-size: 14px;
    }

    .create-btn {
      display: inline-block;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 4px 13px 6px;
      border-radius: 2px;
      line-height: 1.3;
    }

    .error {
      display: block;
      margin-left: 155px;
      margin-top: -2px;
      margin-bottom: 8px;
      color: #b00020;
      font-size: 12px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      form {
        width: 390px;
      }

      .field-row {
        grid-template-columns: 155px 1fr;
      }

      .actions,
      .error {
        margin-left: 165px;
      }
    }

    @media (max-width: 520px) {
      .site-header {
        padding: 0 30px;
      }

      .intro {
        margin-left: 30px;
        margin-right: 20px;
        margin-bottom: 18px;
        font-size: 14px;
      }

      .login-wrap {
        justify-content: flex-start;
        padding-left: 30px;
        padding-right: 20px;
      }

      form {
        width: 100%;
        max-width: 320px;
      }

      .field-row {
        grid-template-columns: 100px 1fr;
        column-gap: 0;
        margin-bottom: 10px;
      }

      .field-row label {
        text-align: left;
        padding-right: 8px;
        font-size: 14px;
      }

      .field-row input {
        width: 100%;
        max-width: 194px;
      }

      .actions,
      .error {
        margin-left: 100px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <a href="#" class="brand">Facebook</a>
  </header>

  <main id="main-content">
    <h1 class="sr-only">Facebook Login to Share</h1>
    <p class="intro">Log into your Facebook account to share.</p>

    <div class="login-wrap">
      <form novalidate aria-label="Facebook login form">
        <div class="field-row">
          <label for="email">Email or phone:</label>
          <input
            type="text"
            id="email"
            name="email"
            required
            aria-describedby="email-error"
            aria-invalid="false"
            autofocus>
        </div>
        <span id="email-error" class="error" role="alert" aria-live="assertive" hidden></span>

        <div class="field-row">
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            aria-describedby="password-error"
            aria-invalid="false">
        </div>
        <span id="password-error" class="error" role="alert" aria-live="assertive" hidden></span>

        <div class="actions">
          <button type="submit" class="login-btn">Log In</button>
          <a href="#" class="forgot-link">Forgot account?</a>
          <a href="#" class="create-btn">Create new account</a>
        </div>

        <div aria-live="polite" id="form-status" class="sr-only"></div>
      </form>
    </div>
  </main>

  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });

    const form = document.querySelector('form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let firstError = null;

      form.querySelectorAll('[required]').forEach(input => {
        const errorEl = document.getElementById(input.getAttribute('aria-describedby'));
        if (!input.value.trim()) {
          input.setAttribute('aria-invalid', 'true');
          errorEl.textContent = `${input.labels[0].textContent.trim()} is required`;
          errorEl.hidden = false;
          if (!firstError) firstError = input;
        } else {
          input.setAttribute('aria-invalid', 'false');
          errorEl.hidden = true;
          errorEl.textContent = '';
        }
      });

      if (firstError) {
        firstError.focus();
      } else {
        document.getElementById('form-status').textContent = 'Form submitted successfully.';
      }
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added descriptive page title; used semantic header and main landmarks; added skip link and id="main-content"; ensured exactly one h1 with descriptive text; associated labels with both inputs; added required attributes; ensured interactive elements have descriptive text; set html lang="en".
[B] ARIA fixes: avoided redundant landmark roles; added form field error associations with aria-describedby and aria-invalid; used aria-live regions for errors and form status; no positive tabindex values retained.
[C] JS patterns added: implemented required form validation with accessible error announcement; implemented tabindex cleanup and focus indicator support.
-->
