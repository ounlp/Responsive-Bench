<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Did you mean search suggestion — Site Name</title>
  <style>
    :root{
      --blue:#2869bd;
      --page-bg:#eef0f6;
      --text:#3a3a3a;
      --link:#3f8cff;
      --card:#ffffff;
      --accent:#ffb321;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      background:var(--page-bg);
      color:var(--text);
    }

    .skip-link{
      position:absolute;
      transform:translateY(-100%);
      left:12px;
      top:12px;
      background:#fff;
      color:#000;
      padding:8px 12px;
      z-index:1000;
      text-decoration:none;
    }

    .skip-link:focus{
      transform:translateY(0);
    }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }
    :focus:not(:focus-visible) {
      outline: none;
    }

    header{
      background:var(--blue);
      height:86px;
      display:flex;
      align-items:center;
    }

    .header-inner{
      width:100%;
      max-width:1280px;
      margin:0 auto;
      padding:0 24px;
      display:flex;
      justify-content:flex-end;
      align-items:center;
    }

    .search-form{
      position:relative;
    }

    .search-label{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    .search-input{
      width:302px;
      height:28px;
      border:none;
      border-radius:3px;
      background:#fff;
      padding:4px 28px 4px 10px;
      font-size:14px;
      font-family:Arial, Helvetica, sans-serif;
    }

    .search-icon{
      position:absolute;
      right:7px;
      top:50%;
      transform:translateY(-50%);
      width:12px;
      height:12px;
      border:2px solid #4a8cff;
      border-radius:1px;
      pointer-events:none;
    }

    main{
      max-width:730px;
      margin:14px auto 0;
      padding:0 10px 40px;
    }

    .panel{
      background:var(--card);
      padding:24px 20px 20px;
      margin-bottom:10px;
    }

    h1{
      margin:0 0 12px;
      font-size:43px;
      line-height:1.1;
      font-weight:700;
      color:#3b3b3b;
    }

    .suggestions{
      margin:0;
      padding-left:40px;
      font-size:18px;
    }

    .suggestions li{
      margin:0;
    }

    a{
      color:var(--link);
      text-decoration:none;
      font-weight:700;
    }

    .ad-card{
      background:#fff;
      border:1px solid var(--accent);
      border-radius:6px;
      padding:8px 10px 12px;
    }

    .ad-image{
      display:block;
      width:100%;
      height:384px;
      object-fit:cover;
      background:#1800ff;
      margin:0 0 2px;
    }

    .ad-title,
    .ad-subtitle{
      font-family:Arial, Helvetica, sans-serif;
      color:var(--accent);
    }

    .ad-title{
      display:block;
      font-size:18px;
      line-height:1.2;
      font-weight:700;
      margin-top:0;
    }

    .ad-subtitle{
      display:block;
      font-size:13px;
      line-height:1.3;
      font-weight:700;
      margin-top:2px;
    }

    footer{
      display:none;
    }

    @media (max-width: 900px){
      main{
        max-width:740px;
        padding:0 26px 40px;
      }

      .search-input{
        width:300px;
      }

      h1{
        font-size:40px;
      }

      .ad-image{
        height:376px;
      }
    }

    @media (max-width: 768px) {
      .nav-toggle { display: block; }
    }

    @media (max-width: 480px){
      header{
        height:90px;
      }

      .header-inner{
        padding:0 0 0 16px;
        justify-content:flex-end;
      }

      .search-input{
        width:70px;
        border-radius:4px 0 0 4px;
      }

      main{
        margin-top:10px;
        padding:0 6px 30px;
      }

      .panel{
        padding:24px 10px 10px;
      }

      h1{
        font-size:39px;
        margin-bottom:10px;
      }

      .suggestions{
        padding-left:40px;
        font-size:17px;
      }

      .ad-card{
        padding:8px 12px 12px;
      }

      .ad-image{
        height:178px;
      }

      .ad-title{
        font-size:17px;
      }

      .ad-subtitle{
        font-size:12px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <div class="header-inner">
      <form class="search-form" action="#" method="get">
        <label class="search-label" for="site-search">Search</label>
        <input class="search-input" id="site-search" name="q" type="search">
        <span class="search-icon" aria-hidden="true"></span>
      </form>
    </div>
  </header>

  <main id="main-content">
    <section class="panel" aria-label="Search suggestion">
      <h1>Did you mean:</h1>
      <ul class="suggestions">
        <li><a href="#">apophthegm or apothegm</a></li>
      </ul>
    </section>

    <section class="panel" aria-label="Advertisement">
      <a href="#" class="ad-card">
        <img src="rick.jpg" alt="Promotional banner for a free browser extension" class="ad-image">
        <span class="ad-title">Install our FREE extension</span>
        <span class="ad-subtitle">Available for chrome users</span>
      </a>
    </section>
  </main>

  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added descriptive page title; used semantic header and main landmarks; added skip link and main-content id; ensured exactly one h1; added meaningful alt text for image; added associated label for search input; ensured descriptive link text; set html lang="en"
[B] ARIA fixes: avoided redundant role attributes on semantic landmarks; added aria-labels to sections for clarity; ensured no positive tabindex values remain
[C] JS patterns added: implemented C-K1/K3 tabindex cleanup and focus indicator styling only
-->
