<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Togel SGP Istana168 — Istana168</title>
  <style>
    :root{
      --bg:#ffffff;
      --card:#434144;
      --button:#c97f3c;
      --button-hover:#b97234;
      --text:#ffffff;
      --blue:#2418ff;
      --shadow:0 2px 8px rgba(0,0,0,.22);
      --radius:20px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color:#111;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .skip-link{
      position:absolute;
      transform:translateY(-100%);
      left:1rem;
      top:1rem;
      background:#fff;
      color:#000;
      padding:.75rem 1rem;
      z-index:1000;
      text-decoration:none;
      box-shadow:var(--shadow);
    }

    .skip-link:focus{
      transform:translateY(0);
    }

    :focus-visible {
      outline: 3px solid #005FCC;
      outline-offset: 2px;
      border-radius: 2px;
    }
    :focus:not(:focus-visible) {
      outline: none;
    }

    .page-wrap{
      width:100%;
      display:flex;
      justify-content:center;
      padding:40px 20px;
    }

    .card{
      width:403px;
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:38px 31px 45px;
    }

    h1{
      margin:0 0 22px;
      color:var(--text);
      text-align:center;
      font-size:34px;
      line-height:1.06;
      font-weight:800;
      text-transform:uppercase;
    }

    .actions{
      display:flex;
      flex-direction:column;
      gap:24px;
      margin-bottom:23px;
    }

    .btn{
      display:block;
      width:100%;
      text-align:center;
      text-decoration:none;
      background:var(--button);
      color:var(--text);
      font-size:18px;
      font-weight:700;
      padding:16px 20px;
      border-radius:999px;
      border:none;
      line-height:1.2;
    }

    .btn:hover{
      background:var(--button-hover);
    }

    .promo-image{
      width:100%;
      height:192px;
      background:var(--blue);
      display:block;
      object-fit:cover;
    }

    header{
      display:block;
    }

    nav[aria-label="Primary actions"]{
      display:block;
    }

    @media (max-width: 900px){
      .card{
        width:402px;
        padding:39px 31px 44px;
      }
      h1{
        font-size:35px;
        margin-bottom:21px;
      }
      .promo-image{
        height:192px;
      }
    }

    @media (max-width: 480px){
      .page-wrap{
        padding:24px 18px;
      }
      .card{
        width:300px;
        padding:34px 30px 42px;
        border-radius:19px;
      }
      h1{
        font-size:33px;
        margin-bottom:24px;
      }
      .actions{
        gap:25px;
        margin-bottom:23px;
      }
      .btn{
        font-size:17px;
        padding:14px 18px;
      }
      .promo-image{
        height:134px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content" aria-label="Togel SGP Istana168 landing panel">
    <div class="page-wrap">
      <section class="card" aria-label="Login and registration panel">
        <header>
          <h1>TOGEL SGP<br>ISTANA168</h1>
        </header>

        <nav aria-label="Primary actions">
          <div class="actions">
            <a href="#" class="btn">Login</a>
            <a href="#" class="btn">Daftar</a>
          </div>
        </nav>

        <img src="rick.jpg" alt="" class="promo-image">
      </section>
    </div>
  </main>

  <script>
    document.querySelectorAll('[tabindex]').forEach(el => {
      const val = parseInt(el.getAttribute('tabindex'), 10);
      if (val > 0) el.removeAttribute('tabindex');
    });
  </script>
</body>
</html>
<!--
CHANGES MADE:
[A] Structural fixes: added descriptive page title; added skip link and main-content id; used semantic main, header, and nav landmarks; ensured exactly one h1; added lang="en"; provided alt attribute for image; ensured interactive links have descriptive text.
[B] ARIA fixes: avoided redundant role attributes on semantic landmarks; applied unique aria-labels to landmarks/sections where helpful; removed positive tabindex via script baseline.
[C] JS patterns added: implemented C-K1/K3 focus indicator styles and tabindex cleanup script only.
-->
